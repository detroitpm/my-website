<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pre-Purchase Report</title>

<!-- Filled at runtime by ppr-view.js with PPR_REPORT_CSS from ppr-shared.js -
     the exact stylesheet behind the report PDF, so this page and that PDF
     can't drift apart. It sits ABOVE the page-chrome styles below on purpose:
     PPR_REPORT_CSS styles a standalone document (it sets `body` itself), and
     the chrome rules that follow are what turn that into a hosted page. -->
<style id="printCss"></style>

<style>
  /* Page chrome. Colour tokens (--ink, --gold, --muted, --line, --paper)
     come from PPR_REPORT_CSS above, so there's one palette, not two. */
  :root{ --maxw:860px; }
  body{margin:0;background:#f5f4f1;color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;}
  .shell{max-width:var(--maxw);margin:0 auto;padding:22px 16px 64px;}
  .bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
    justify-content:space-between;margin-bottom:16px;}
  .bar .who{font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);}
  .btn{font:inherit;font-size:14px;padding:8px 14px;border:2px solid var(--ink);
    background:var(--paper);color:var(--ink);cursor:pointer;}
  .btn:hover{background:var(--gold);}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .state{background:var(--paper);border:2px solid var(--line);padding:28px 22px;
    text-align:center;color:var(--muted);}
  .state.err{border-color:var(--ink);color:var(--ink);}
  .state[hidden]{display:none;}
  #doc{background:var(--paper);}
  @media (max-width:600px){ #doc .ppr-page{padding:24px 16px;} }

  /* Camera button ppr-view.js adds to each line that has a photo. */
  .ppr-cam{font:inherit;font-size:15px;line-height:1;padding:3px 6px;margin-left:2px;
    border:1.5px solid var(--ink);background:var(--paper);cursor:zoom-in;vertical-align:baseline;}
  .ppr-cam:hover{background:var(--gold);}
  .ppr-cam:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  /* Buyers don't have CompanyCam logins, so the lightbox's
     "Open in CompanyCam" link would only dead-end. */
  .sow-lb-src{display:none !important;}

  @media print{
    body{background:var(--paper);}
    .shell{max-width:none;padding:0;}
    .no-print{display:none !important;}
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="bar no-print">
      <span class="who">Pre-Purchase Underwriting Report</span>
      <button class="btn" id="printBtn" hidden>Print / Save as PDF</button>
    </div>
    <div id="state" class="state">Loading&hellip;</div>
    <div id="doc"></div>
  </div>

<script src="ppr-shared.js"></script>
<script src="sow-lightbox.js"></script>
<script src="ppr-view.js"></script>
</body>
</html>
